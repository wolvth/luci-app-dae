# ============================================================
# OpenWrt 插件编译配置
# ============================================================
# 格式说明：
#   FEED <名称> <git地址> [branch/tag]
#   PACKAGE <包名>
#   TARGET <config行>
#
# TARGET 行会直接写入 .config
# 内置 feed (如 luci/packages/routing) 无需声明 FEED
# ============================================================

# ---------- 目标设备 (rockchip / NanoPi R4S) ----------
TARGET CONFIG_TARGET_rockchip=y
TARGET CONFIG_TARGET_rockchip_armv8=y
TARGET CONFIG_TARGET_rockchip_armv8_DEVICE_friendlyarm_nanopi-r4s=y

# ---------- 自定义 feed ----------
FEED qnatter https://github.com/qimaoww/QNatter.git

# ---------- 要编译的包 ----------
# QNatter 系列
PACKAGE qnatter
PACKAGE luci-app-qnatter
PACKAGE luci-i18n-qnatter-zh-cn

# 示例：再加一个 feed 和包（取消注释即可）
# FEED kiddin9 https://github.com/kiddin9/openwrt-packages.git
# PACKAGE luci-app-openclash
# PACKAGE luci-app-bypass
# PACKAGE luci-app-ddns-go
